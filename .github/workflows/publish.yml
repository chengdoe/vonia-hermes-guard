name: publish-immutable-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish.yml
      - .dockerignore
      - Dockerfile
      - build-manifest.json
      - feishu_group_sender_identity.patch
      - file_safety.py

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-immutable-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fixed release context
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify the reviewed release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum Dockerfile | awk '{print $1}')" = "7851324d184bab668a20925fcb001f6500b6e61943d03ba590ec5d48f939cf42"
          test "$(sha256sum .dockerignore | awk '{print $1}')" = "ff4b7049b02bfa07ed511eab0a1ff96092ffc7f086d5d24124200fb569655841"
          test "$(sha256sum file_safety.py | awk '{print $1}')" = "0107e4004eb38b12c49952b0e509094f1351ffc4e9c7252dc1ec9bd018af16f4"
          test "$(sha256sum feishu_group_sender_identity.patch | awk '{print $1}')" = "7588cf0c51b7db43b29d0e83e6ec9bfcbd20e4c8c43f3e97f96aad6c1b9998a3"
          test "$(jq -r .base_image build-manifest.json)" = "nousresearch/hermes-agent@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e"
          test "$(jq -r .patched_sha256 build-manifest.json)" = "0107e4004eb38b12c49952b0e509094f1351ffc4e9c7252dc1ec9bd018af16f4"
          test "$(jq -r .feishu_group_identity_source_sha256 build-manifest.json)" = "55cbb66fa60abdd3710a3476c197b31d46dc3ff13ec401c23557ee6465f96029"
          test "$(jq -r .feishu_group_identity_patch_sha256 build-manifest.json)" = "7588cf0c51b7db43b29d0e83e6ec9bfcbd20e4c8c43f3e97f96aad6c1b9998a3"
          test "$(jq -r .feishu_group_identity_patched_sha256 build-manifest.json)" = "32c7071cb3ce1b7063c374862963ef41ce9f91b8ed11760e5a2a2efd330981a6"

      - name: Log in with the ephemeral repository token
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish the linux-amd64 image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --name vonia-release --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "ghcr.io/chengdoe/vonia-hermes-guard:3c27eb-fileguard-feishu-identity-v2" \
            --metadata-file /tmp/build-metadata.json \
            --push \
            .
          digest="$(jq -r '.["containerimage.digest"]' /tmp/build-metadata.json)"
          test -n "$digest"
          test "$digest" != "null"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published immutable digest: $digest"

      - name: Verify registry manifest using the same ephemeral token
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/chengdoe/vonia-hermes-guard@${{ steps.build.outputs.digest }}"

      - name: Remove the temporary registry session
        if: always()
        shell: bash
        run: docker logout ghcr.io || true
