name: publish-immutable-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish.yml
      - .dockerignore
      - Dockerfile
      - build-manifest.json
      - feishu_dm_reply_routing.patch
      - feishu_group_sender_identity.patch
      - feishu_reply_routing_canary.py
      - file_safety.py

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-immutable-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fixed release context
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify the reviewed release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum Dockerfile | awk '{print $1}')" = "33ccec1e4c5a222bb9a9b15d20240cab6d2fe28dbd85dc892308eab5dc9553df"
          test "$(sha256sum .dockerignore | awk '{print $1}')" = "9d516ec3b4950d4ad8039a33dd90a3aa1cf7988def9f3f3b8cd2f3113e20c07a"
          test "$(sha256sum file_safety.py | awk '{print $1}')" = "0107e4004eb38b12c49952b0e509094f1351ffc4e9c7252dc1ec9bd018af16f4"
          test "$(sha256sum feishu_group_sender_identity.patch | awk '{print $1}')" = "f07083559e7a0a7480167ab4bb7ff7a3d7989069dd82340cda62e88c4a8b6cff"
          test "$(sha256sum feishu_dm_reply_routing.patch | awk '{print $1}')" = "a91b333f7d713ae055044c20e2726df84c8a3ddf3e8efaff28f5927d516b71df"
          test "$(sha256sum feishu_reply_routing_canary.py | awk '{print $1}')" = "ff11aa95e79545d9342ae5bc1055c74672a5c80d9350d8d98bea79c6f52bcbd7"
          test "$(jq -r .base_image build-manifest.json)" = "nousresearch/hermes-agent@sha256:16788311e2fa3035456bdc1bafb8ec2b1777db64ebf020af9bb7eb73c3712c9e"
          test "$(jq -r .patched_sha256 build-manifest.json)" = "0107e4004eb38b12c49952b0e509094f1351ffc4e9c7252dc1ec9bd018af16f4"
          test "$(jq -r .feishu_group_identity_source_sha256 build-manifest.json)" = "55cbb66fa60abdd3710a3476c197b31d46dc3ff13ec401c23557ee6465f96029"
          test "$(jq -r .feishu_group_identity_patch_sha256 build-manifest.json)" = "f07083559e7a0a7480167ab4bb7ff7a3d7989069dd82340cda62e88c4a8b6cff"
          test "$(jq -r .feishu_group_identity_patched_sha256 build-manifest.json)" = "4c5bcaa8c2ce725ae284c4a33c665599c7b844f63ebcf212a86f3a627c272d8b"
          test "$(jq -r .feishu_dm_reply_routing_source_sha256 build-manifest.json)" = "67262c97333b9e8274d269229ae6d0adecee104eaf5729208d0ea9b0ae8b814c"
          test "$(jq -r .feishu_dm_reply_routing_patch_sha256 build-manifest.json)" = "a91b333f7d713ae055044c20e2726df84c8a3ddf3e8efaff28f5927d516b71df"
          test "$(jq -r .feishu_dm_reply_routing_patched_sha256 build-manifest.json)" = "b0540e301b49bff7995776312d038d6346ee0514be1e092d7d11a094a7a01273"
          test "$(jq -r .feishu_reply_routing_contract build-manifest.json)" = "explicit_thread_id_only"
          test "$(jq -c .default_cmd build-manifest.json)" = '["sleep","infinity"]'

      - name: Log in with the ephemeral repository token
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish the linux-amd64 image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --name vonia-release --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "ghcr.io/chengdoe/vonia-hermes-guard:3c27eb-fileguard-feishu-routing-v4" \
            --metadata-file /tmp/build-metadata.json \
            --push \
            .
          digest="$(jq -r '.["containerimage.digest"]' /tmp/build-metadata.json)"
          test -n "$digest"
          test "$digest" != "null"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published immutable digest: $digest"

      - name: Verify registry manifest using the same ephemeral token
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/chengdoe/vonia-hermes-guard@${{ steps.build.outputs.digest }}"

      - name: Verify Feishu quote and topic routing in the published image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            -v "$PWD/feishu_reply_routing_canary.py:/tmp/feishu_reply_routing_canary.py:ro" \
            "ghcr.io/chengdoe/vonia-hermes-guard@${{ steps.build.outputs.digest }}" \
            /tmp/feishu_reply_routing_canary.py

      - name: Remove the temporary registry session
        if: always()
        shell: bash
        run: docker logout ghcr.io || true
