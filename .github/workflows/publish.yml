name: publish-immutable-image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/publish.yml
      - .dockerignore
      - Dockerfile
      - build-manifest.json
      - compaction_notice_canary.py
      - feishu_dm_reply_routing.patch
      - feishu_group_sender_identity.patch
      - feishu_reply_routing_canary.py
      - file_safety.py
      - gateway_compaction_progress_silence.patch

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-immutable-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the fixed release context
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Verify the reviewed release inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum Dockerfile | awk '{print $1}')" = "0468b294256bc504f58eabe5c2516ce6f11fc4d4823cd64e3deda07ad8d65b12"
          test "$(sha256sum .dockerignore | awk '{print $1}')" = "eff87ca018d37b45c2f00fc4b3f831430d5322a5e2b39baa96cef3166f92fae1"
          test "$(sha256sum build-manifest.json | awk '{print $1}')" = "85d9778e21b9ca8128829c096c90eeafa9d2983a7a89faadc398aa87c612cd43"
          test "$(sha256sum gateway_compaction_progress_silence.patch | awk '{print $1}')" = "a5a59033b06e6349f56c72070ecff778310d1b787b0aa2d30cb435b89081a642"
          test "$(sha256sum compaction_notice_canary.py | awk '{print $1}')" = "e7161af73ab7edc14d8f216d0aea27f93fdbb1ca2d4e60d5e622a56b51deaf16"
          test "$(sha256sum feishu_reply_routing_canary.py | awk '{print $1}')" = "ff11aa95e79545d9342ae5bc1055c74672a5c80d9350d8d98bea79c6f52bcbd7"
          test "$(jq -r .base_image build-manifest.json)" = "ghcr.io/chengdoe/vonia-hermes-guard@sha256:e84019aefecaab92792e0f9046b6eef1862dfcd057f23c5af7233e613abea663"
          test "$(jq -r .source_sha256 build-manifest.json)" = "0b749a90ff5740b5c8ce9d138f869aca19295f4c458e3b680e9be9fd7b0fb2ec"
          test "$(jq -r .patch_sha256 build-manifest.json)" = "a5a59033b06e6349f56c72070ecff778310d1b787b0aa2d30cb435b89081a642"
          test "$(jq -r .patched_sha256 build-manifest.json)" = "d65c4b5989df481bad963b6364f119bc624663b17e232839b637dbb521694fd3"
          test "$(jq -r .behavior build-manifest.json)" = "routine_auto_compaction_statuses_are_silent_on_chat_unless_opted_in"
          test "$(jq -c .default_cmd build-manifest.json)" = '["sleep","infinity"]'

      - name: Log in with the ephemeral repository token
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and publish the linux-amd64 image
        id: build
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --name vonia-release --driver docker-container --use
          docker buildx inspect --bootstrap
          docker buildx build \
            --platform linux/amd64 \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "ghcr.io/chengdoe/vonia-hermes-guard:3c27eb-fileguard-feishu-routing-v5-compaction-silent" \
            --metadata-file /tmp/build-metadata.json \
            --push \
            .
          digest="$(jq -r '.["containerimage.digest"]' /tmp/build-metadata.json)"
          test -n "$digest"
          test "$digest" != "null"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Published immutable digest: $digest"

      - name: Verify registry manifest using the same ephemeral token
        shell: bash
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "ghcr.io/chengdoe/vonia-hermes-guard@${{ steps.build.outputs.digest }}"

      - name: Verify Feishu quote and topic routing in the published image
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            -v "$PWD/feishu_reply_routing_canary.py:/tmp/feishu_reply_routing_canary.py:ro" \
            "ghcr.io/chengdoe/vonia-hermes-guard@${{ steps.build.outputs.digest }}" \
            /tmp/feishu_reply_routing_canary.py

      - name: Verify automatic compaction stays silent on chat surfaces
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --entrypoint python \
            -v "$PWD/compaction_notice_canary.py:/tmp/compaction_notice_canary.py:ro" \
            "ghcr.io/chengdoe/vonia-hermes-guard@${{ steps.build.outputs.digest }}" \
            /tmp/compaction_notice_canary.py

      - name: Remove the temporary registry session
        if: always()
        shell: bash
        run: docker logout ghcr.io || true
